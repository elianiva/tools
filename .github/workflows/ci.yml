name: CI

# `push` covers main, where the deploy runs; `pull_request` covers every other branch.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production deploy halfway through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Each check is its own job, so the four start together and the run ends when
# the slowest one does. Typecheck, test, and build restore Turbo's cache: a
# package whose inputs did not change replays its last result.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-typecheck-${{ hashFiles('apps/**', 'packages/**', 'examples/**', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig*.json', 'vite.config.ts') }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ hashFiles('apps/**', 'packages/**', 'examples/**', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig*.json', 'vite.config.ts') }}
          restore-keys: |
            turbo-${{ runner.os }}-test-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ hashFiles('apps/**', 'packages/**', 'examples/**', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig*.json', 'vite.config.ts') }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Only a push to main deploys, and only once every check has passed.
  deploy:
    needs: [check, typecheck, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Sentry is optional. A deploy without a DSN ships with the SDK off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
      # The commit is the release that errors, traces, and source maps point at.
      VITE_SENTRY_RELEASE: ${{ github.sha }}
      # Only the build uploads source maps. Without the token, org, and project it skips the upload.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG || vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The website build imports the generated Panda styles, which are not committed.
      - run: pnpm --filter @tools/web codegen
      # `--yes` accepts the state-store bootstrap in CI. The first run may create
      # the Cloudflare state-store Worker in the same account.
      - run: pnpm exec alchemy deploy --stage prod --yes
